spring.datasource.url=jdbc:postgresql://localhost:5432/financial_health_app_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# For improved naming strategy (optional but good practice)
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Secret Key
# IMPORTANT: THIS IS A PLACEHOLDER! Use a strong, unique secret and store it securely,
# preferably outside the codebase (e.g., environment variable or secrets manager).
jwt.secret=DefaultSecretKeyPlaceholder_ChangeThisImmediately_0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ

# Gemini API Configuration
# IMPORTANT: Replace YOUR_API_KEY_HERE with your actual Gemini API key.
# For production, it's strongly recommended to set this via an environment variable
# (e.g., GEMINI_API_KEY) rather than hardcoding in the properties file.
gemini.api.key=YOUR_API_KEY_HERE
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false # Explicitly disable actuator endpoints from OpenAPI docs unless desired

# Global API Info for OpenAPI
springdoc.api-docs.info.title=Financial Health Web Application API
springdoc.api-docs.info.version=v0.1.0-SNAPSHOT # Using a common SNAPSHOT versioning for dev
springdoc.api-docs.info.description=API documentation for the Financial Health Web Application, providing services for managing personal finances including authentication, transactions, budgets, goals, insights, and administrative tasks.
